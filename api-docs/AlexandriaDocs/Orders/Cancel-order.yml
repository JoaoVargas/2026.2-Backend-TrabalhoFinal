info:
  name: "Cancel order"
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{baseUrl}}/orders/1"
  auth:
    type: basic
    username: "{{customerEmail}}"
    password: "{{customerPassword}}"

docs: |-
  Cancela o pedido `OPEN` e devolve o estoque. `409` se já estiver `COMPLETED` ou `CANCELED`.

  Retorna `200` com o pedido atualizado.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
