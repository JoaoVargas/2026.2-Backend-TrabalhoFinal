info:
  name: "List orders"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/orders"
  auth:
    type: basic
    username: "{{customerEmail}}"
    password: "{{customerPassword}}"

docs: |-
  Lista os pedidos do usuário autenticado.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
