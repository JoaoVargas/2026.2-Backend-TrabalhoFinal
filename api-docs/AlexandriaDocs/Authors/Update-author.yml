info:
  name: "Update author"
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/authors/1"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "J.R.R. Tolkien",
        "bio": "English writer, poet and philologist"
      }
  auth: inherit

docs: |-
  **Requer:** `ADMIN` (HTTP Basic).

  Substitui `name` e `bio`.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
