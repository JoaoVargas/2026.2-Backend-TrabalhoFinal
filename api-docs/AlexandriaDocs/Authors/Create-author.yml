info:
  name: "Create author"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/authors"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Frank Herbert",
        "bio": "American science fiction author"
      }
  auth: inherit

docs: |-
  **Requer:** `ADMIN` (HTTP Basic).

  `name` obrigatório; `bio` opcional.

  Resposta: `201 Created`.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
