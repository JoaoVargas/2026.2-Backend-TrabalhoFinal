info:
  name: "List users by role"
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/users"
  params:
    - name: role
      value: "ADMIN"
      type: query
  auth: none

docs: |-
  Lista usuários que possuem a role informada.

  **Acesso:** público (sem autenticação).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
