info:
  name: "List users"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users"
  params:
    - name: sortDir
      value: "ASC"
      type: query
  auth: none

docs: |-
  Lista usuários.

  Query params (opcionais): `sortDir` (`ASC`|`DESC`, padrão `ASC`) ou `role` (filtra por nome do papel; quando informado, `sortDir` é ignorado).

  **Acesso:** público (sem autenticação).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
