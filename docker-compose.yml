services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: alexandria
      POSTGRES_USER: alexandria
      POSTGRES_PASSWORD: alexandria
    volumes:
      - alexandria-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alexandria"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: alexandria
      DB_USER: alexandria
      DB_PASSWORD: alexandria
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  alexandria-db:
